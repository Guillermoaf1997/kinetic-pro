<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KINETIC PRO · Calisthenics SaaS</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#07090C">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #07090C;
      --bg-sidebar: #0B0E13;
      --surface-1: #10141B;
      --surface-2: #161C26;
      --surface-3: #1E2735;
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.15);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --accent-green: #10B981;
      --accent-green-glow: rgba(16, 185, 129, 0.16);
      --accent-amber: #F59E0B;
      --accent-red: #EF4444;
      --accent-blue: #38BDF8;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
    }

    body {
      background-color: var(--bg-canvas);
      background-image: radial-gradient(circle at 60% 0%, rgba(16, 185, 129, 0.07) 0%, transparent 50%);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .app-shell { display: flex; min-height: 100vh; }
    .sidebar { display: none; }
    .main-area { flex: 1; display: flex; flex-direction: column; padding-bottom: 100px; }

    @media (min-width: 920px) {
      .sidebar {
        display: flex; flex-direction: column; width: 260px;
        background: var(--bg-sidebar); border-right: 1px solid var(--border-subtle);
        padding: 24px 16px; position: sticky; top: 0; height: 100vh; flex-shrink: 0;
      }
      .main-area { padding-bottom: 60px; }
      .bottom-nav { display: none !important; }
    }

    .brand {
      display: flex; align-items: center; gap: 10px;
      padding: 0 10px 20px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 18px;
    }
    .brand-logo {
      width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent-green), #059669);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #04130D; font-family: var(--font-mono);
    }

    .side-nav { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .side-btn {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      border-radius: var(--radius-sm); background: transparent; border: 1px solid transparent;
      color: var(--text-secondary); font-family: var(--font-sans); font-size: 0.9rem;
      font-weight: 600; cursor: pointer; text-align: left; transition: all 0.15s;
    }
    .side-btn:hover { background: var(--surface-1); color: var(--text-primary); }
    .side-btn.active {
      background: var(--accent-green-glow); color: var(--accent-green);
      border-color: rgba(16, 185, 129, 0.25);
    }

    .topbar {
      padding: 16px 24px; border-bottom: 1px solid var(--border-subtle);
      background: rgba(7, 9, 12, 0.88); backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 20;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .topbar-title { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
    .topbar-sub { font-size: 0.78rem; color: var(--text-secondary); margin-top: 2px; }

    #app-container { width: 100%; max-width: 1120px; margin: 0 auto; padding: 22px 18px; }

    .bento-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
    @media (min-width: 920px) {
      .bento-grid { grid-template-columns: 1.25fr 0.95fr; align-items: start; }
      .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    }

    .panel {
      background: linear-gradient(180deg, var(--surface-1) 0%, #0D1117 100%);
      border: 1px solid var(--border-subtle);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 8px 24px rgba(0, 0, 0, 0.35);
      border-radius: var(--radius-lg); padding: 20px;
    }

    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      border-radius: 999px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; background: var(--surface-2); color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: var(--radius-md); font-family: var(--font-sans); font-weight: 700;
      cursor: pointer; transition: transform 0.1s, filter 0.15s, background 0.15s;
      border: 1px solid transparent;
    }
    .btn:active { transform: scale(0.98); }

    .btn-emerald {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: #04130D; padding: 14px 20px; font-size: 0.98rem;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.25);
    }
    .btn-emerald:hover { filter: brightness(1.08); }

    .btn-ghost {
      background: var(--surface-2); color: var(--text-primary);
      border-color: var(--border-subtle); padding: 8px 13px; font-size: 0.82rem;
    }
    .btn-ghost:hover { background: var(--surface-3); border-color: var(--border-strong); }

    .form-group { margin-bottom: 14px; text-align: left; }
    .form-label { display: block; font-size: 0.76rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }

    .form-input, .form-select {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm); padding: 11px 12px; color: var(--text-primary);
      font-family: var(--font-sans); font-size: 0.92rem; transition: border-color 0.2s;
    }
    .form-input:focus, .form-select:focus {
      border-color: var(--accent-green); outline: none; box-shadow: 0 0 0 2px var(--accent-green-glow);
    }

    .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip-toggle {
      padding: 8px 12px; border-radius: var(--radius-sm); background: var(--surface-2);
      border: 1px solid var(--border-subtle); color: var(--text-secondary);
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
    }
    .chip-toggle.selected {
      background: var(--accent-green-glow); border-color: var(--accent-green); color: var(--accent-green);
    }

    .dpda-banner {
      background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: var(--radius-sm); padding: 8px 12px; margin-top: 10px;
      font-size: 0.78rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px;
    }

    .set-grid-header, .set-row {
      display: grid; grid-template-columns: 32px 1fr 118px 60px 42px;
      align-items: center; gap: 6px; padding: 8px 4px; border-top: 1px solid var(--border-subtle);
    }
    .set-grid-header { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-top: 10px; }
    .set-row.completed { background: rgba(16, 185, 129, 0.11); border-radius: var(--radius-sm); }

    .stepper { display: flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-step {
      width: 33px; height: 35px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle); background: var(--surface-2);
      color: var(--text-primary); font-size: 1.05rem; font-weight: 700; cursor: pointer;
    }
    .val-box { min-width: 40px; text-align: center; font-family: var(--font-mono); font-size: 1.02rem; font-weight: 800; }

    .rpe-pill {
      height: 32px; border-radius: 6px; border: 1px solid var(--border-subtle);
      background: var(--surface-2); color: var(--text-secondary);
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700; cursor: pointer;
    }
    .rpe-pill[data-rpe="9"] { color: var(--accent-amber); border-color: rgba(245, 158, 11, 0.4); }
    .rpe-pill[data-rpe="10"] { color: var(--accent-red); border-color: rgba(239, 68, 68, 0.45); }

    .btn-check {
      width: 38px; height: 35px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong); background: var(--surface-2);
      color: var(--text-muted); font-size: 1rem; cursor: pointer;
    }
    .set-row.completed .btn-check { background: var(--accent-green); border-color: var(--accent-green); color: #04130D; font-weight: 900; }

    .lib-row {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 12px 14px; background: var(--surface-1); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); margin-bottom: 8px;
    }
    .lib-row.excluded { opacity: 0.48; border-color: rgba(239, 68, 68, 0.35); }
    .lib-row.favorite { border-color: rgba(245, 158, 11, 0.45); }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(11, 14, 19, 0.96); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-subtle);
      display: grid; grid-template-columns: repeat(4, 1fr); z-index: 40;
    }
    .bottom-nav.hidden { display: none; }
    .nav-btn {
      background: none; border: none; color: var(--text-muted); padding: 11px 4px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 0.7rem; font-weight: 600; cursor: pointer;
    }
    .nav-btn.active { color: var(--accent-green); }

    .rest-bar {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 28px); max-width: 540px; background: #141B24;
      border: 1px solid var(--accent-amber); border-radius: var(--radius-lg);
      padding: 12px 18px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75); z-index: 50; overflow: hidden;
    }
    .rest-bar.hidden { display: none; }
    .rest-bar-content { display: flex; justify-content: space-between; align-items: center; }
    .rest-clock { font-family: var(--font-mono); font-size: 1.65rem; font-weight: 800; color: var(--accent-amber); }
    .rest-progress { position: absolute; bottom: 0; left: 0; height: 3px; width: 100%; background: rgba(255, 255, 255, 0.08); }
    #rest-progress-fill { height: 100%; background: var(--accent-amber); transition: width 0.9s linear; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(4, 6, 8, 0.9); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 100;
      overflow-y: auto;
    }
    .modal-card {
      background: var(--surface-1); border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg); padding: 26px; width: 100%; max-width: 460px;
    }
    .big-clock { font-family: var(--font-mono); font-size: 4rem; font-weight: 800; margin: 16px 0; text-align: center; }
  </style>
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">K</div>
        <div>
          <div style="font-weight:800; font-size:1.05rem; letter-spacing:0.04em;">KINETIC PRO</div>
          <div style="font-size:0.7rem; color:var(--text-muted);">Calisthenics Athlete OS</div>
        </div>
      </div>

      <nav class="side-nav" aria-label="Navegación principal">
        <button class="side-btn active" data-tab="train" data-action="switch-tab" aria-current="page">⚡ Panel & Anatomía</button>
        <button class="side-btn" data-tab="library" data-action="switch-tab">📚 Catálogo & Filtros</button>
        <button class="side-btn" data-tab="science" data-action="switch-tab">🧬 Motor Sobrecarga</button>
        <button class="side-btn" data-tab="stats" data-action="switch-tab">📊 Métricas & Atletas</button>
      </nav>

      <div id="sidebar-athlete-box" style="padding:12px; background:var(--surface-1); border-radius:10px; border:1px solid var(--border-subtle); font-size:0.78rem;"></div>
    </aside>

    <div class="main-area">
      <header id="app-header" class="topbar"></header>
      <main id="app-container"></main>
    </div>
  </div>

  <nav id="bottom-nav" class="bottom-nav" aria-label="Navegación principal (móvil)">
    <button class="nav-btn active" data-tab="train" data-action="switch-tab" aria-current="page">
      <span aria-hidden="true" style="font-size:1.15rem;">⚡</span><span>Entrenar</span>
    </button>
    <button class="nav-btn" data-tab="library" data-action="switch-tab">
      <span aria-hidden="true" style="font-size:1.15rem;">📚</span><span>Ejercicios</span>
    </button>
    <button class="nav-btn" data-tab="science" data-action="switch-tab">
      <span aria-hidden="true" style="font-size:1.15rem;">🧬</span><span>Sobrecarga</span>
    </button>
    <button class="nav-btn" data-tab="stats" data-action="switch-tab">
      <span aria-hidden="true" style="font-size:1.15rem;">📊</span><span>Atleta</span>
    </button>
  </nav>

  <div id="rest-timer-bar" class="rest-bar hidden" role="status" aria-live="polite">
    <div class="rest-bar-content">
      <div>
        <div style="font-size: 0.7rem; text-transform: uppercase; color: var(--text-secondary); font-weight: 700;">Recuperación DPDA-4</div>
        <div id="rest-time-display" class="rest-clock">0:00</div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-ghost" data-action="rest-adjust" data-delta="-15">-15s</button>
        <button class="btn btn-ghost" data-action="rest-adjust" data-delta="15">+15s</button>
        <button class="btn btn-ghost" style="border-color: var(--accent-amber); color: var(--accent-amber);" data-action="rest-skip">Saltar</button>
      </div>
    </div>
    <div class="rest-progress"><div id="rest-progress-fill"></div></div>
  </div>

  <input type="file" id="import-file-input" accept=".json" style="display:none" aria-label="Importar archivo de perfil JSON">

  <script src="./utils.js"></script>
  <script src="./catalog.js"></script>
  <script src="./engine.js"></script>
  <script src="./timer.js"></script>
  <script src="./charts.js"></script>
  <script src="./app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./sync.js"></script>
</body>
</html>
